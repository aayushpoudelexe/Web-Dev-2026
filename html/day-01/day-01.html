<!DOCTYPE html>                                     <!--<!DOCTYPE html> tells the browser to use HTML5-->

<html>                                              <!--<html> is the root tag which wraps the entire HTML document-->

    <head>                                          <!--<head> contains the webpage information-->

        <title>Day-01</title>                       <!--<title> sets the title of the browser tab-->

    </head>

    <body>                                          <!--<body> contains visible content of a webpage-->

        <h1>Day-01</h1>                             <!--<h1> contains the main heading of the webpage-->

        <p>Day-01 of learning Web Development</p>   <!--<p> marks a paragraph of the webpage-->

    </body>

</html>
